[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agro-monitor-pampa"
version = "0.1.0"
description = "In-season crop monitoring for Argentina's Pampas: Sentinel-2 NDVI, INTA crop masks and a leave-one-campaign-out yield model"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "datakrdo" }]
dependencies = [
    "pandas>=2.0",
    "pyarrow>=15.0",
    "scipy>=1.11",
    "openeo>=0.30",
    "rasterio>=1.3",
    "scikit-learn>=1.4",
    "geopandas>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "pillow>=10.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".agents", ".claude", ".serena", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "E731", "B905"]  # lambdas locales y zip() de largo igual son deliberados

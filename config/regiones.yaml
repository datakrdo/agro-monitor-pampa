# Una región = una lista de provincias. `provincias: []` significa
# "todo el país" (para cuando se quiera escalar más allá del piloto).
# `deptos` (opcional): códigos INDEC de 5 dígitos para acotar la región dentro de
# esas provincias. Los departamentos sin superficie de cultivo simplemente van a salir
# con n_pixeles=0 en la extracción y quedan afuera del análisis solos,
# así que no hace falta un filtro adicional acá.

pampa-humeda:
  nombre: "Pampa húmeda"
  descripcion: "Núcleo sojero-triguero: Buenos Aires, Santa Fe, Córdoba"
  provincias: ["Buenos Aires", "Santa Fe", "Córdoba"]

argentina:
  nombre: "Argentina"
  descripcion: "Todo el país (fase 2, sin precomputar todavía)"
  provincias: []


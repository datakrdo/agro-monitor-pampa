# Un cultivo = una entrada. Agregar un cultivo no toca código, solo esta
# tabla (más verificar la máscara y el MAGyP; ver "Agregar un cultivo" en el README).
#
# Obligatorios (src/agro/config.py los valida al cargar):
#   nombre            texto para el selector de la app.
#   mes_inicio/mes_fin  ventana de campaña (mes calendario, 1-12), para asignar
#                     fechas a campañas. cruza_anio: true si mes_fin < mes_inicio.
#   ext_mes_inicio/ext_mes_fin  ventana de EXTRACCIÓN satelital (CDSE). Es la que
#                     paga créditos: el costo crece con los meses. ext_mes_fin es
#                     exclusivo (5 = hasta fin de abril). Si ext_mes_fin <=
#                     ext_mes_inicio la ventana cruza el año.
#   mnc_estacion      "verano" (MNC_ver{aa}.tif) o "invierno" (MNC_inv{aa}.tif).
#                     Donde aa = año de siembra + 1 si cruza_anio, si no el año.
#   mnc_clase         código (o lista) del cultivo en la leyenda del MNC del INTA.
#   magyp_cultivo     nombre exacto en el CSV de estimaciones agrícolas del MAGyP.
#
# Opcionales:
#   mnc_clase_campania  excepciones por campaña (año de siembra): la leyenda del
#                     MNC cambia entre campañas. Verificar cada campaña en el .qml
#                     de su registro de Zenodo.
#   region            región de regiones.yaml donde se muestrea y extrae el cultivo
#                     (por defecto pampa-humeda). Los scripts la toman de acá.
#   tmax_calor        °C sobre los que un día cuenta como "de calor" (por defecto 32).
#   notas             lista de limitaciones que se muestran en Metodología.
#   worldcereal_clase solo lo usa gee.py (v1), para comparar con GEE más adelante.

soja:
  nombre: "Soja"
  mes_inicio: 11
  mes_fin: 5
  ext_mes_inicio: 11     # ventana de extracción CDSE (el costo crece con la ventana)
  ext_mes_fin: 6         # exclusivo: nov-may
  cruza_anio: true
  worldcereal_clase: temporarycrops
  mnc_estacion: verano   # MNC INTA: MNC_ver{aa}.tif
  mnc_clase: 11          # Soja (verificado en las leyendas de 2019/20 a 2024/25)
  mnc_clase_campania:    # excepciones por campaña (año de siembra)
    2018: [1, 2]         # MNC 2018/19 usa otra leyenda: 1 Soja 1ra, 2 CI-Soja (soja de segunda)
  magyp_cultivo: "soja total"
  notas:
    - "El MNC de 2018/19 usa otra leyenda (soja de primera y de segunda); esa campaña es menos comparable."

trigo:
  nombre: "Trigo"
  mes_inicio: 5
  mes_fin: 12
  ext_mes_inicio: 8      # ventana de extracción CDSE: ago-ene, para ver la senescencia y la cosecha (cebada vs trigo)
  ext_mes_fin: 1         # exclusivo: ago-ene (cruza el año)
  cruza_anio: false
  worldcereal_clase: wintercereals
  mnc_estacion: invierno # MNC INTA: MNC_inv{aa}.tif
  mnc_clase: 16          # "Cereales de invierno" (incluye cebada: limitación a documentar)
  mnc_clase_campania:    # excepciones por campaña (año de siembra); códigos según los informes del INTA
    2018: [2, 3, 6]      # MNC 2018/19 es un mapa único (MNC_inv18.tif = enlace a MNC_ver19.tif): 6 CI sin cultivo de verano, 2 y 3 dobles cultivos con invierno
    2019: 0              # 2019 y 2020: "Cereales de invierno" es la clase 0 (verificar contra el raster)
    2020: 0
  magyp_cultivo: "trigo total"
  notas:
    - 'El trigo del MNC es "cereales de invierno" e incluye cebada, avena y verdeos.'

